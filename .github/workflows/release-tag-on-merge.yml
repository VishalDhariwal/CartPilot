name: Release Tag on Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Exact tag name to create (e.g. v1.0.0). Overrides automatic increment.'
        required: false
        type: string
        default: ''
      tag_prefix:
        description: 'Prefix used for automatic incremental tags'
        required: false
        type: string
        default: 'v'
      create_github_release:
        description: 'Create an official GitHub Release with auto-generated notes'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-tag:
    name: Generate Release Tag & GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_step.outputs.tag }}
      created: ${{ steps.tag_step.outputs.created }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Next Tag
        id: tag_step
        run: |
          PREFIX="${{ inputs.tag_prefix || 'v' }}"
          SPECIFIED_TAG="${{ inputs.tag_name || '' }}"

          if [ -n "$SPECIFIED_TAG" ]; then
            TARGET_TAG="$SPECIFIED_TAG"
            echo "Using explicitly specified tag: $TARGET_TAG"
          else
            # Retrieve latest tag matching prefix
            LATEST_TAG=$(git tag -l "${PREFIX}*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              TARGET_TAG="${PREFIX}1.0.0"
              echo "No existing tags found with prefix '${PREFIX}'. Starting at: $TARGET_TAG"
            else
              echo "Found latest tag: $LATEST_TAG"
              # Extract version numbers
              VERSION_NUM="${LATEST_TAG#$PREFIX}"
              # Split by '.' if semver (e.g. 1.0.0) or increment integer
              if [[ "$VERSION_NUM" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
                NEW_PATCH=$((PATCH + 1))
                TARGET_TAG="${PREFIX}${MAJOR}.${MINOR}.${NEW_PATCH}"
              elif [[ "$VERSION_NUM" =~ ^([0-9]+)$ ]]; then
                NEW_NUM=$((VERSION_NUM + 1))
                TARGET_TAG="${PREFIX}${NEW_NUM}"
              else
                TARGET_TAG="${PREFIX}${VERSION_NUM}.1"
              fi
              echo "Incremented to new tag: $TARGET_TAG"
            fi
          fi

          # Check if tag already exists on remote
          if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Tag $TARGET_TAG already exists on commit $(git rev-parse $TARGET_TAG)."
            echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT
            echo "created=false" >> $GITHUB_OUTPUT
          else
            git tag -a "$TARGET_TAG" -m "Release $TARGET_TAG"
            git push origin "$TARGET_TAG"
            echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT
            echo "created=true" >> $GITHUB_OUTPUT
            echo "Successfully created and pushed tag $TARGET_TAG."
          fi

      - name: Create GitHub Release
        if: ${{ (inputs.create_github_release == true || github.event_name == 'push') && steps.tag_step.outputs.created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag_step.outputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          EXTRA_ARGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            --title "CartPilot Release $TAG_NAME" \
            --generate-notes \
            $EXTRA_ARGS
