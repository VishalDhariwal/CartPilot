name: Build, Publish, and Deploy to Azure

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Image name inside Azure Container Registry'
        required: false
        type: string
        default: 'cartpilot-app'
      push_latest:
        description: 'Also tag and push as latest'
        required: false
        type: boolean
        default: true
      deploy_to_azure:
        description: 'Deploy to Azure Container Apps after pushing image'
        required: false
        type: boolean
        default: true
      platform:
        description: 'Target platform for container'
        required: false
        type: string
        default: 'linux/amd64'

env:
  DEFAULT_IMAGE_NAME: 'cartpilot-app'

jobs:
  build-and-push:
    name: Build & Push Docker Image to ACR
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.config.outputs.registry }}
      image_name: ${{ steps.config.outputs.image_name }}
      full_image: ${{ steps.config.outputs.full_image }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Configuration
        id: config
        run: |
          # Prioritize secret ACR_LOGIN_SERVER, fallback to repository variable
          REGISTRY="${{ secrets.ACR_LOGIN_SERVER || vars.ACR_LOGIN_SERVER }}"
          if [ -z "$REGISTRY" ]; then
            echo "::error::Neither secrets.ACR_LOGIN_SERVER nor vars.ACR_LOGIN_SERVER is defined. Please set this in GitHub Repository Settings."
            exit 1
          fi

          IMG_NAME="${{ inputs.image_name || env.DEFAULT_IMAGE_NAME }}"
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "image_name=$IMG_NAME" >> $GITHUB_OUTPUT
          echo "full_image=$REGISTRY/$IMG_NAME" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.config.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      - name: Docker Metadata & Tag Management
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.config.outputs.full_image }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.push_latest == true || github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=tag

      # Build and push the Docker image
      - name: Build and Push Docker Image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platform || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Build Action Summary
        run: |
          echo "### 🚀 Azure Container Registry Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: \`${{ steps.config.outputs.registry }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.config.outputs.image_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build_push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Published Image Tags:" >> $GITHUB_STEP_SUMMARY
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    if: needs.build-and-push.result == 'success' && (inputs.deploy_to_azure == null || inputs.deploy_to_azure == true)
    steps:
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy / Update Azure Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e
            APP_NAME="${{ secrets.CONTAINER_APP_NAME || vars.CONTAINER_APP_NAME || 'cartpilot-app' }}"
            RG_NAME="${{ secrets.RESOURCE_GROUP || vars.RESOURCE_GROUP || 'cartpilot-rg' }}"
            REGISTRY="${{ needs.build-and-push.outputs.registry }}"
            IMG_NAME="${{ needs.build-and-push.outputs.image_name }}"
            TARGET_IMAGE="${REGISTRY}/${IMG_NAME}:${{ github.sha }}"

            echo "🚀 Target Container App: $APP_NAME in Resource Group: $RG_NAME"
            echo "📦 Deploying Image: $TARGET_IMAGE"

            # Check if Azure Container App exists
            if az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" &>/dev/null; then
              echo "🔄 Updating Container App image to $TARGET_IMAGE..."
              ENV_ARGS=()
              [ -n "${{ secrets.GEMINI_API_KEY }}" ] && ENV_ARGS+=(GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}")
              [ -n "${{ secrets.RAZORPAY_KEY_ID }}" ] && ENV_ARGS+=(RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}")
              [ -n "${{ secrets.RAZORPAY_KEY_SECRET }}" ] && ENV_ARGS+=(RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}")
              [ -n "${{ secrets.BYPASS_RAZORPAY }}" ] && ENV_ARGS+=(BYPASS_RAZORPAY="${{ secrets.BYPASS_RAZORPAY }}")

              if [ ${#ENV_ARGS[@]} -gt 0 ]; then
                az containerapp update \
                  --name "$APP_NAME" \
                  --resource-group "$RG_NAME" \
                  --image "$TARGET_IMAGE" \
                  --set-env-vars "${ENV_ARGS[@]}"
              else
                az containerapp update \
                  --name "$APP_NAME" \
                  --resource-group "$RG_NAME" \
                  --image "$TARGET_IMAGE"
              fi

              APP_URL=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
              echo "### ✅ Azure Container App Deployed Successfully" >> $GITHUB_STEP_SUMMARY
              echo "- **Application URL**: [https://$APP_URL](https://$APP_URL)" >> $GITHUB_STEP_SUMMARY
              echo "- **Resource Group**: \`$RG_NAME\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Container App**: \`$APP_NAME\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Image Tag**: \`$TARGET_IMAGE\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Azure Container App '$APP_NAME' was not found in Resource Group '$RG_NAME'."
              echo "### ⚠️ Azure Deployment Note" >> $GITHUB_STEP_SUMMARY
              echo "The container image was successfully published to ACR (\`$TARGET_IMAGE\`), but Container App \`$APP_NAME\` does not yet exist in \`$RG_NAME\`." >> $GITHUB_STEP_SUMMARY
              echo "Run \`ops/setup_azure.sh\` to provision the Container App in Azure." >> $GITHUB_STEP_SUMMARY
            fi
